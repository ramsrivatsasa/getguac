<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">Know your money: a simple financial snapshot — visual explanation</title><desc id="desc">Income flows into your monthly budget and expenses flow out. Separately, list what you own and what you owe to understand your financial position.</desc><rect width="800" height="560" rx="24" fill="#F8FAFC"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#6D28D9">GETGUAC ACADEMY</text><text x="30" y="78" font-family="Arial,sans-serif" font-size="20" fill="#475569">Start here · Illustrative example</text><text x="48" y="158" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#0369A1">Income</text><text x="600" y="158" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#0369A1">Expenses</text><path d="M55 222h155m-16-12 16 12-16 12" fill="none" stroke="#4F7DE0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M584 222h155m-16-12 16 12-16 12" fill="none" stroke="#4F7DE0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 270h155m-16-12 16 12-16 12" fill="none" stroke="#4F7DE0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M584 270h155m-16-12 16 12-16 12" fill="none" stroke="#4F7DE0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 318h155m-16-12 16 12-16 12" fill="none" stroke="#4F7DE0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M584 318h155m-16-12 16 12-16 12" fill="none" stroke="#4F7DE0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><g fill="none" stroke="#172D3B" stroke-width="8"><rect x="270" y="208" width="260" height="130" rx="10"/><circle cx="400" cy="273" r="43"/><path d="M292 240h23v-12m192 12h-23v-12M292 306h23v12m192-12h-23v12"/></g><text x="383" y="290" font-family="Arial,sans-serif" font-size="46" font-weight="600" fill="#172D3B">$</text><text x="272" y="386" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#172D3B">Your monthly budget</text><path d="M32 421h736" stroke="#CBD5E1" stroke-width="2"/><text x="48" y="470" font-family="Arial,sans-serif" font-size="28" font-weight="600" fill="#172D3B">What you own</text><text x="450" y="470" font-family="Arial,sans-serif" font-size="28" font-weight="600" fill="#172D3B">What you owe</text><text x="48" y="510" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#475569">Assets: cash, possessions</text><text x="450" y="510" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#475569">Debts: balances to repay</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">Read your utility bill and find ways to use less — visual explanation</title><desc id="desc">Read a utility bill as usage multiplied by the applicable rate, plus fixed charges. Verify the actual tariff, taxes and adjustments before calculating the total. Reducing usage is a task, not guaranteed dollar savings.</desc><rect width="800" height="560" rx="24" fill="#F8FAFC"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#6D28D9">GETGUAC ACADEMY</text><text x="30" y="78" font-family="Arial,sans-serif" font-size="20" fill="#475569">Budgeting and cash flow · Illustrative example</text><text x="30" y="140" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">Read the bill before choosing a task</text><rect x="30" y="200" width="230" height="180" rx="20" fill="#FFFFFF" stroke="#6D28D9"/><text x="48" y="254" font-family="Arial,sans-serif" font-size="26" font-weight="600" fill="#172D3B">Usage</text><text x="48" y="315" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#172D3B">kWh / gallons</text><rect x="280" y="200" width="230" height="180" rx="20" fill="#FFFFFF" stroke="#0369A1"/><text x="298" y="254" font-family="Arial,sans-serif" font-size="26" font-weight="600" fill="#172D3B">Rate</text><text x="298" y="315" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#172D3B">Your tariff</text><rect x="530" y="200" width="230" height="180" rx="20" fill="#FFFFFF" stroke="#C2410C"/><text x="548" y="254" font-family="Arial,sans-serif" font-size="26" font-weight="600" fill="#172D3B">Fixed charges</text><text x="548" y="315" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#172D3B">Verify the bill</text><text x="30" y="452" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">Usage × rate + fixed charges</text><text x="30" y="504" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#172D3B">Check taxes, adjustments and tiered rates.</text></svg>
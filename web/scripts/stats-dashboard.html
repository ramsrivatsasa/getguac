<!doctype html>
<meta charset="utf-8">
<title>GetGuac — live stats</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Colours are the validated reference palette: an ordinal one-hue blue ramp for
   the funnel (monotone L, light end clears the surface in both modes) and a
   single hue for one-series bars. Text never wears a series colour. */
.viz-root, body {
  color-scheme: light;
  --surface-0:      #f4f4f2;
  --surface-1:      #fcfcfb;
  --line:           #e2e1dc;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #83827c;
  --series-1:       #2a78d6;
  --ord-1:          #86b6ef;
  --ord-2:          #5598e7;
  --ord-3:          #2a78d6;
  --ord-4:          #184f95;
  --good:           #0ca30c;
  --critical:       #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) body {
    color-scheme: dark;
    --surface-0:    #111110;
    --surface-1:    #1a1a19;
    --line:         #33332f;
    --text-primary: #ffffff;
    --text-secondary:#c3c2b7;
    --text-muted:   #8f8e85;
    --series-1:     #3987e5;
    --ord-1:        #6da7ec;
    --ord-2:        #3987e5;
    --ord-3:        #256abf;
    --ord-4:        #184f95;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-0);color:var(--text-primary);
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px;line-height:1.5}
header{padding:26px 28px 18px;border-bottom:1px solid var(--line);background:var(--surface-1);
  display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
h1{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;letter-spacing:-.03em}
.meta{color:var(--text-muted);font-size:12px;margin-left:auto;display:flex;gap:14px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block;margin-right:5px}
/* filters in one row above the charts */
.filters{display:flex;gap:6px}
.filters button{font:inherit;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;
  border:1px solid var(--line);background:transparent;color:var(--text-secondary);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--series-1);border-color:var(--series-1);color:#fff}
main{padding:22px 28px 60px;max-width:1180px;margin:auto;display:grid;gap:22px}
section{background:var(--surface-1);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
h2{margin:0 0 4px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:16px;letter-spacing:-.02em}
.sub{margin:0 0 16px;color:var(--text-muted);font-size:12px}
/* stat tiles - a headline number is not a chart */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile .n{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;line-height:1;letter-spacing:-.03em}
.tile .l{margin-top:6px;color:var(--text-secondary);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.tile .h{margin-top:3px;color:var(--text-muted);font-size:11px}
/* bars: thin marks, 4px rounded data-end, baseline anchored */
.row{display:grid;grid-template-columns:190px 1fr 46px;align-items:center;gap:12px;padding:3px 0}
.row .k{color:var(--text-secondary);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:14px;background:color-mix(in srgb,var(--text-muted) 12%,transparent);border-radius:4px;overflow:hidden}
.bar{height:100%;border-radius:0 4px 4px 0;min-width:2px;transition:width .3s}
.row .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text-primary)}
.row.zero .k,.row.zero .v{color:var(--text-muted);font-weight:600}
/* funnel */
.fun{display:grid;gap:8px}
.fun .step{display:grid;grid-template-columns:200px 1fr 92px;align-items:center;gap:12px}
.fun .pct{font-size:11px;color:var(--text-muted);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em;
  font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line);color:var(--text-secondary)}
td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-primary);font-weight:700}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10.5px;font-weight:800}
.pill.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.no{background:color-mix(in srgb,var(--critical) 15%,transparent);color:var(--critical)}
.err{background:color-mix(in srgb,var(--critical) 12%,transparent);border-color:var(--critical);color:var(--critical)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:900px){.cols{grid-template-columns:1fr}.row,.fun .step{grid-template-columns:130px 1fr 42px}}
</style>

<header>
  <h1>GetGuac — live stats</h1>
  <div class="filters" id="filters">
    <button data-days="1"  aria-pressed="false">24h</button>
    <button data-days="7"  aria-pressed="false">7d</button>
    <button data-days="30" aria-pressed="true">30d</button>
    <button data-days="90" aria-pressed="false">90d</button>
  </div>
  <div class="meta"><span id="stamp"><span class="dot"></span>loading…</span></div>
</header>

<main id="app"><section><p class="sub">Fetching…</p></section></main>

<script>
const app = document.getElementById('app')
const stamp = document.getElementById('stamp')
let days = 30
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]))
const fmtDate = s => new Date(s).toLocaleString('en-US',
  { timeZone:'America/New_York', month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:true })

function bars(items, hue) {
  const max = Math.max(1, ...items.map(i => i[1]))
  return items.map(([k, v]) => `
    <div class="row ${v ? '' : 'zero'}" title="${esc(k)}: ${v}">
      <div class="k">${esc(k)}</div>
      <div class="track"><div class="bar" style="width:${(v / max * 100).toFixed(1)}%;background:${hue}"></div></div>
      <div class="v">${v}</div>
    </div>`).join('')
}

function render(d) {
  if (d.error) { app.innerHTML = `<section class="err"><h2>Error</h2><p>${esc(d.error)}</p></section>`; return }
  const s = d.signups
  const top = d.funnel[0][1] || 0
  const html = []

  if (s) html.push(`<section>
    <h2>Signups</h2><p class="sub">Every account ever created, including the ones that never confirmed.</p>
    <div class="tiles">
      <div class="tile"><div class="n">${s.total}</div><div class="l">accounts</div></div>
      <div class="tile"><div class="n">${s.confirmed}</div><div class="l">confirmed</div>
        <div class="h">${s.total ? Math.round(s.confirmed / s.total * 100) : 0}% of signups</div></div>
      <div class="tile"><div class="n">${s.unconfirmed}</div><div class="l">awaiting email</div></div>
      <div class="tile"><div class="n">${s.scanned}</div><div class="l">ever scanned</div>
        <div class="h">${s.total ? Math.round(s.scanned / s.total * 100) : 0}% of signups</div></div>
    </div></section>`)

  // These are independent counters over a window, NOT a per-visitor funnel:
  // nobody is tracked from step to step, so a later stage can legitimately
  // exceed an earlier one (different counters were wired at different times).
  // Bars are therefore scaled to the largest stage, and the only ratio shown is
  // the one that is actually meaningful — parses per CTA tap.
  const fmax = Math.max(1, ...d.funnel.map(f => f[1]))
  const taps = d.funnel[0][1] || 0
  const wins = d.funnel[2][1] || 0
  html.push(`<section>
    <h2>Receipt trial steps</h2>
    <p class="sub">The no-account scanner on /join, in flow order. These are separate counters, not one visitor
      followed through — so a later step can exceed an earlier one, and stage-to-stage percentages would lie.</p>
    <div class="fun">${d.funnel.map(([label, v], i) => `
      <div class="step" title="${esc(label)}: ${v}">
        <div class="k">${esc(label)}</div>
        <div class="track"><div class="bar" style="width:${(v / fmax * 100).toFixed(1)}%;background:var(--ord-${i + 1})"></div></div>
        <div class="pct">${v}</div>
      </div>`).join('')}</div>
    <div class="tiles" style="margin-top:16px">
      <div class="tile"><div class="n">${taps ? Math.round(wins / taps * 100) + '%' : '—'}</div>
        <div class="l">parses per CTA tap</div>
        <div class="h">${wins} parsed / ${taps} tapped over ${d.days}d</div></div>
    </div></section>`)

  html.push(`<div class="cols">
    <section><h2>Button clicks</h2><p class="sub">Every wired counter, zeros included — a missing counter and a counter at zero mean different things.</p>
      ${d.groups.map(([g, items]) => `<h2 style="font-size:13px;margin:14px 0 6px">${esc(g)}</h2>${bars(items, 'var(--series-1)')}`).join('')}
    </section>
    <section><h2>Most-viewed pages</h2><p class="sub">Real pageviews over the window, bots excluded server-side.</p>
      ${bars(d.pages.map(p => [p.path, p.views]), 'var(--series-1)')}
    </section></div>`)

  html.push(`<div class="cols">
    <section><h2>Recent button presses</h2><p class="sub">Last 48 hours, newest first (America/New_York).</p>
      <table><thead><tr><th>when</th><th>button</th></tr></thead><tbody>
      ${d.events.length ? d.events.map(e => `<tr><td>${fmtDate(e.at)}</td><td>${esc(e.name)}</td></tr>`).join('')
        : '<tr><td colspan="2">No presses in the last 48 hours.</td></tr>'}
      </tbody></table></section>
    <section><h2>Latest signups</h2><p class="sub">Newest first.</p>
      <table><thead><tr><th>when</th><th>email</th><th>state</th></tr></thead><tbody>
      ${s && s.recent.length ? s.recent.map(r => `<tr><td>${fmtDate(r.created_at)}</td><td>${esc(r.email)}</td>
        <td>${r.confirmed ? '<span class="pill ok">confirmed</span>' : '<span class="pill no">unconfirmed</span>'}
            ${r.scanned ? ' <span class="pill ok">scanned</span>' : ''}</td></tr>`).join('')
        : '<tr><td colspan="3">None.</td></tr>'}
      </tbody></table></section></div>`)

  if (d.errors?.length) html.push(`<section class="err"><h2>Queries that failed</h2>
    <p class="sub">Shown rather than hidden — a silent zero would look like real data.</p>
    ${d.errors.map(e => `<div>${esc(e)}</div>`).join('')}</section>`)

  app.innerHTML = html.join('')
  stamp.innerHTML = `<span class="dot"></span>updated ${new Date().toLocaleTimeString('en-US', { hour12: true })} · auto-refresh 60s`
}

async function load() {
  try {
    const r = await fetch(`/api/stats?days=${days}`)
    render(await r.json())
  } catch (e) {
    stamp.textContent = 'connection lost — is the script still running?'
  }
}
document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return
  days = Number(b.dataset.days)
  document.querySelectorAll('#filters button').forEach(x => x.setAttribute('aria-pressed', x === b))
  load()
})
load()
setInterval(load, 60000)
</script>

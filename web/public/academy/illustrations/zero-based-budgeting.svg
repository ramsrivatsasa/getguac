<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">How to build a zero-based budget in simple steps — visual explanation</title><desc id="desc">Illustrative $3,500 income assigned to rent and utilities ($1,450), groceries and fuel ($650), insurance and minimum payments ($300), emergency savings ($300), extra debt ($200), and wants and buffer ($600). Nothing is left unassigned; savings are a job too.</desc><rect width="800" height="560" rx="24" fill="#F8FAFC"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#6D28D9">GETGUAC ACADEMY</text><text x="30" y="78" font-family="Arial,sans-serif" font-size="20" fill="#475569">Budgeting and cash flow · Illustrative example</text><text x="30" y="130" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">$3,500 income → every dollar assigned</text><text x="30" y="182" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">Rent + utilities</text><rect x="405" y="160" width="240" height="28" rx="5" fill="#6D28D9"/><text x="670" y="182" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">$1,450</text><text x="30" y="236" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">Groceries + fuel</text><rect x="405" y="214" width="107.58620689655173" height="28" rx="5" fill="#0369A1"/><text x="670" y="236" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">$650</text><text x="30" y="290" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">Insurance + minimums</text><rect x="405" y="268" width="49.6551724137931" height="28" rx="5" fill="#C2410C"/><text x="670" y="290" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">$300</text><text x="30" y="344" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">Emergency savings</text><rect x="405" y="322" width="49.6551724137931" height="28" rx="5" fill="#6D28D9"/><text x="670" y="344" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">$300</text><text x="30" y="398" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">Extra debt</text><rect x="405" y="376" width="33.10344827586207" height="28" rx="5" fill="#0369A1"/><text x="670" y="398" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">$200</text><text x="30" y="452" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">Wants + buffer</text><rect x="405" y="430" width="99.3103448275862" height="28" rx="5" fill="#C2410C"/><text x="670" y="452" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">$600</text><text x="30" y="533" font-family="Arial,sans-serif" font-size="28" font-weight="600" fill="#6D28D9">Left unassigned: $0 · Savings count as a job</text></svg>
:root{
  --ink:#15281C; --body:#3d4a42; --soft:#5C6B60;
  --emerald:#059669; --emerald-deep:#065f46;
  --accent:#059669; --accent-soft:#d1fae5;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Jakarta',system-ui,sans-serif;color:var(--body);
  background:#f2f7ee; overflow:hidden;
}
/* drifting background blobs, like the deck */
.blob{position:fixed;border-radius:50%;filter:blur(2px);opacity:.55;pointer-events:none;z-index:0;
  background:radial-gradient(circle at 35% 35%, #dcefc8, #cfe8b6);}
.b1{width:44vmax;height:44vmax;top:-18vmax;right:-14vmax;animation:drift 26s ease-in-out infinite alternate}
.b2{width:34vmax;height:34vmax;bottom:-14vmax;left:-10vmax;animation:drift 32s ease-in-out infinite alternate-reverse}
.b3{width:16vmax;height:16vmax;top:52%;right:20%;opacity:.35;animation:drift 20s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(4vmax,-3vmax) scale(1.07)}}

/* chrome */
.chrome{position:fixed;z-index:30}
.voicePill{top:18px;left:18px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e2ece1;
  border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;
  box-shadow:0 2px 10px rgba(21,40,28,.07);user-select:none}
.voicePill .dot{width:8px;height:8px;border-radius:50%;background:#cbd5cd;transition:background .2s}
.voicePill.on .dot{background:var(--emerald);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.55}}
.counter{top:22px;right:22px;font-size:13px;font-weight:700;color:var(--soft);letter-spacing:.06em}

.controls{bottom:20px;right:20px;display:flex;gap:8px}
.controls button{width:44px;height:44px;border-radius:50%;border:1px solid #e2ece1;background:#fff;color:var(--ink);
  font-size:16px;cursor:pointer;box-shadow:0 2px 10px rgba(21,40,28,.08);display:flex;align-items:center;justify-content:center;
  transition:transform .12s ease, background .12s}
.controls button:hover{transform:translateY(-2px);background:#f2fbf3}
.controls .play{background:var(--emerald);color:#fff;border-color:var(--emerald)}
.dots{bottom:30px;left:50%;transform:translateX(-50%);display:flex;gap:7px}
.dots i{width:8px;height:8px;border-radius:50%;background:#cfdccf;cursor:pointer;transition:all .25s}
.dots i.on{background:var(--emerald);width:22px;border-radius:5px}
.brand{bottom:24px;left:22px;font-family:'Bricolage',sans-serif;font-weight:800;color:var(--ink);font-size:15px;
  display:flex;align-items:center;gap:7px;opacity:.85}

/* slide stage */
.stage{position:relative;z-index:10;height:100%;display:flex;align-items:center;justify-content:center;padding:56px 6vw 84px}
.slide{width:min(1150px,100%);display:grid;grid-template-columns:1.15fr .85fr;gap:5vw;align-items:center}
.slide.solo{grid-template-columns:1fr;text-align:center;justify-items:center}

.kicker{font-size:12.5px;font-weight:800;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;margin-bottom:14px;
  opacity:0;animation:up .5s .05s ease forwards}
h1{font-family:'Bricolage',sans-serif;font-weight:800;color:var(--ink);letter-spacing:-0.02em;
  font-size:clamp(30px,4.6vw,54px);line-height:1.04;margin-bottom:22px;opacity:0;animation:up .55s .12s ease forwards}
.solo h1{font-size:clamp(36px,6vw,68px)}
.lead{font-size:clamp(15px,1.4vw,19px);max-width:640px;opacity:0;animation:up .55s .22s ease forwards}
ul.bullets{list-style:none;display:flex;flex-direction:column;gap:12px;max-width:620px}
ul.bullets li{font-size:clamp(13.5px,1.15vw,15.5px);line-height:1.55;color:var(--soft);padding-left:16px;position:relative;
  opacity:0;animation:up .5s ease forwards}
ul.bullets li::before{content:'';position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:2px;background:var(--accent)}
ul.bullets li b{color:var(--ink);font-weight:700}
ul.bullets li:nth-child(1){animation-delay:.25s}ul.bullets li:nth-child(2){animation-delay:.37s}
ul.bullets li:nth-child(3){animation-delay:.49s}ul.bullets li:nth-child(4){animation-delay:.61s}
ul.bullets li:nth-child(5){animation-delay:.73s}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* visual card */
.viz{opacity:0;animation:pop .6s .3s cubic-bezier(.2,.9,.3,1.2) forwards}
@keyframes pop{from{opacity:0;transform:translateY(26px) scale(.94)}to{opacity:1;transform:none}}
.card{background:#fff;border-radius:22px;box-shadow:0 18px 50px rgba(21,40,28,.12);padding:22px;
  animation:float 5s 1s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.card h4{font-family:'Bricolage',sans-serif;font-weight:800;color:var(--ink);font-size:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.card h4 span.sub{font-family:'Jakarta';font-weight:700;font-size:11px;color:var(--soft)}
.row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:#f6faf4;margin-bottom:8px;font-size:13px;font-weight:700;color:var(--ink)}
.row .ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);font-size:15px;flex-shrink:0}
.row .grow{flex:1;min-width:0}
.row .sub{display:block;font-weight:400;font-size:11px;color:var(--soft)}
.row .val{font-family:'Bricolage',sans-serif;font-weight:800;font-size:14px}
.chipline{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:6px 11px;border-radius:999px;font-size:12px;font-weight:700;background:#f0f7ee;color:var(--emerald-deep);opacity:0;animation:up .4s ease forwards}

/* categorize — video-exact floating pills */
.catCloud{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:center;max-width:400px;margin:0 auto}
.catPill{background:#fff;border-radius:999px;padding:12px 22px;font-weight:700;font-size:15px;color:var(--ink);
  box-shadow:0 10px 26px rgba(21,40,28,.10);display:inline-flex;gap:9px;align-items:center;white-space:nowrap;
  opacity:0;animation:catIn .5s ease forwards}
.catPill.custom{background:#fdf3dd;border:1px solid #f5e3ba;color:#8a5a17}
@keyframes catIn{from{opacity:0;transform:translateY(16px) scale(.85)}to{opacity:1;transform:none}}
.bigNum{font-family:'Bricolage',sans-serif;font-weight:800;font-size:44px;color:var(--ink);letter-spacing:-.02em}
.badge{display:inline-flex;align-items:center;gap:6px;background:#e8f7ec;color:#116b3f;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800}
.badge.warn{background:#fdeeee;color:#b3261e}
.bar{height:12px;border-radius:7px;background:#eef2ec;overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,#7bb661,#f2b036,#e05252);width:0;animation:grow 1.1s .6s ease forwards}
.bar.p60 i{--w:60%}.bar.p40 i{--w:40%}.bar.p85 i{--w:85%}.bar.p25 i{--w:25%}
@keyframes grow{to{width:var(--w,70%)}}
.scanline{position:relative;overflow:hidden;border-radius:14px}
.scanline::after{content:'';position:absolute;left:0;right:0;top:-40%;height:38%;
  background:linear-gradient(180deg,transparent,rgba(101,163,13,.22),transparent);animation:scan 2.2s 1s ease-in-out infinite}
@keyframes scan{0%{top:-40%}60%,100%{top:110%}}
.stars{font-size:26px;letter-spacing:4px}
.stars b{color:#f2b036;opacity:0;animation:starin .3s ease forwards}
.stars b:nth-child(1){animation-delay:.5s}.stars b:nth-child(2){animation-delay:.7s}.stars b:nth-child(3){animation-delay:.9s}
.stars b:nth-child(4){animation-delay:1.1s}.stars b:nth-child(5){animation-delay:1.3s}
@keyframes starin{from{opacity:0;transform:scale(.3) rotate(-30deg)}to{opacity:1;transform:none}}
.smash{position:relative}
.smash::after{content:'';position:absolute;left:40px;right:34%;top:50%;height:2.5px;background:var(--emerald);transform:scaleX(0);transform-origin:left;animation:strike 1s 1.4s ease forwards}
@keyframes strike{to{transform:scaleX(1)}}
.mascot{font-size:clamp(64px,9vw,110px);animation:bob 3.4s ease-in-out infinite;display:inline-block}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
.cta{display:inline-flex;align-items:center;gap:9px;margin-top:26px;background:var(--emerald);color:#fff;text-decoration:none;
  font-weight:800;font-size:16px;padding:15px 30px;border-radius:999px;box-shadow:0 12px 30px rgba(5,150,105,.35);
  opacity:0;animation:up .5s .5s ease forwards;transition:transform .15s}
.cta:hover{transform:translateY(-2px)}
/* dedup — video-exact: two tilted duplicates fly in, merge to one, keeper chip pops */
.dedupStage{position:relative;height:240px}
.rcpt{position:absolute;left:50%;top:36px;width:200px;margin-left:-100px;background:#fff;border-radius:14px;
  box-shadow:0 14px 34px rgba(21,40,28,.14);padding:14px 18px 16px}
.rcpt .store{display:block;font-size:10.5px;font-weight:700;color:#7d8a80;letter-spacing:.05em;margin-bottom:4px}
.rcpt .amt{font-family:'Bricolage',sans-serif;font-weight:800;font-size:24px;color:var(--ink)}
.rcpt.r1{opacity:0;animation:dIn1 .7s .3s ease forwards, dMerge1 .9s 2s ease forwards}
.rcpt.r2{opacity:0;animation:dIn2 .7s .5s ease forwards, dMerge2 .9s 2s ease forwards}
@keyframes dIn1{from{opacity:0;transform:translate(-74px,-72px) rotate(-9deg)}to{opacity:1;transform:translate(-74px,-14px) rotate(-5deg)}}
@keyframes dIn2{from{opacity:0;transform:translate(66px,-52px) rotate(8deg)}to{opacity:1;transform:translate(66px,6px) rotate(3.5deg)}}
@keyframes dMerge1{from{opacity:1;transform:translate(-74px,-14px) rotate(-5deg)}to{opacity:0;transform:translate(0,0) rotate(0)}}
@keyframes dMerge2{from{opacity:1;transform:translate(66px,6px) rotate(3.5deg)}to{opacity:1;transform:translate(0,0) rotate(0)}}
.keeperChip{position:absolute;left:50%;bottom:10px;display:flex;align-items:center;gap:9px;
  background:#eaf6e6;border:1px solid #cde8c4;border-radius:12px;padding:9px 16px;font-size:13px;font-weight:700;color:#2f6b1f;
  opacity:0;transform:translateX(-50%) translateY(24px);animation:chipIn .6s 3s ease forwards;white-space:nowrap}
.keeperChip .box{width:17px;height:17px;border-radius:4px;background:#4d9a26;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
@keyframes chipIn{to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* worth-it — video-exact GuacScore donut */
.donutWrap{text-align:center}
.donutHost{position:relative;display:inline-block}
.donut{width:min(230px,58vw);display:block;transform:rotate(-90deg)}
.donut .track{fill:none;stroke:#e7ece3;stroke-width:13}
.donut .prog{fill:none;stroke:#57a30d;stroke-width:13;stroke-linecap:round;stroke-dasharray:314.16;stroke-dashoffset:314.16;
  animation:donutDraw 1.5s .6s cubic-bezier(.3,.8,.3,1) forwards}
@keyframes donutDraw{to{stroke-dashoffset:56.5}}
.donutCenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donutCenter .score{font-family:'Bricolage',sans-serif;font-weight:800;font-size:54px;color:var(--ink);line-height:1;opacity:0;animation:up .6s 1s ease forwards}
.donutCenter .lbl2{font-size:10px;font-weight:800;letter-spacing:.16em;color:#57a30d;margin-top:5px;opacity:0;animation:up .5s 1.2s ease forwards}
.starsCap{font-size:11px;font-weight:700;color:var(--soft);margin-top:4px;opacity:0;animation:up .5s 1.6s ease forwards}

/* under-the-hood AI avatar chips (every content slide, like the deck) */
.hood{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:22px;opacity:0;animation:up .5s .85s ease forwards}
.hood .lbl{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--soft);text-transform:uppercase}
.person{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid #e4eae2;border-radius:999px;padding:3px 12px 3px 4px;
  box-shadow:0 1px 5px rgba(21,40,28,.06);font-size:11.5px;font-weight:700;color:#3d4a42}
.person .av{position:relative;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#bef264,#34d399,#065f46);
  display:flex;align-items:center;justify-content:center;font-size:13px}
.person .av i{position:absolute;top:-4px;right:-5px;font-style:normal;font-size:10px}
.routeline{stroke-dasharray:220;stroke-dashoffset:220;animation:draw 1.6s .8s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* slide transitions */
.stage .slide{animation:none}
.stage.enter .slide{}
.fadeout{animation:out .3s ease forwards !important}
@keyframes out{to{opacity:0;transform:translateY(-14px)}}

@media (max-width:860px){
  .slide{grid-template-columns:1fr;gap:26px}
  .viz{max-width:420px;width:100%;margin:0 auto}

<script>
// ─── Slide data — mirrors web/src/app/how-it-works/Presentation.jsx ───
const ACCENTS = {
  emerald:['#059669','#d1fae5'], lime:['#65A30D','#ecfccb'], amber:['#b45309','#fef3c7'],
  sky:['#0369a1','#e0f2fe'], indigo:['#4f46e5','#e0e7ff'], rose:['#be123c','#ffe4e6'],
}
const S = [
{type:'hero',accent:'emerald',title:'From receipt to insight, in seconds.',dur:30000,
 lead:"Your money's wingman. Snap it, forward it, or drop a statement — Guac-AI turns raw paper into searchable, scored, beautifully categorized spending data.",
 narration:"Welcome to GetGuac — your money's wingman. Every receipt you've ever lost, every fee you didn't notice, every subscription that keeps quietly draining your account... GetGuac catches it all. Snap a quick photo, forward an emailed receipt, or drop in a credit-card statement, and watch Guac-AI turn raw paper into searchable, scored, beautifully categorized spending data. No spreadsheets. No manual typing. No more shoeboxes of crumpled receipts. Ready? Here's the whole flow, end to end. Take your time — each slide is yours to read."},
{n:'1',accent:'emerald',kick:'Three ways in',title:'Get a receipt.',art:'capture',dur:32000,
 bullets:[['Camera','Snap a paper receipt from the mobile app — single shot or batch of up to three at a time.'],
 ['Email','Forward an e-receipt to your free you+g@getguac.app inbox. It auto-files in 10 minutes.'],
 ['Statement (optional)',"Drop a credit-card or bank statement PDF and every line becomes a receipt row. Totally optional."]],
 narration:"Step one. Getting receipts into GetGuac is honestly the easiest part. Three different ways, all designed to fit your real life. Way number one — your phone's camera. Just snap that paper receipt at the restaurant, the gas station, the grocery store. Crumpled, faded, even folded — GetGuac handles it. Got a stack of receipts? Batch mode lets you fire off up to three in a row. Way number two — email. Every GetGuac account comes with its own free at-getguac-dot-app inbox. Forward your Amazon order confirmations, your Uber receipts, your subscription renewals... and within ten minutes they file themselves. And way number three is completely optional — credit card or bank statements. If you want a complete picture of your spending, drop a statement PDF onto the Statements page and every single line becomes a fully-tracked receipt row. But you don't have to. Many people are happy just snapping and forwarding — the choice is always yours."},
{n:'2',accent:'lime',kick:'Built for online shopping',title:'Your @getguac.app inbox.',art:'inbox',dur:36000,
 bullets:[['Your own address','Pick any handle: you@getguac.app. Yours forever, free with every account.'],
 ['Forward receipts','Send any receipt to you+g@getguac.app — the +g tag auto-files and parses it within ten minutes.'],
 ['Real two-way mail','A full mailbox: open, read, reply, send. Not just a parsing trick.'],
 ['Shopping shield','Hand it out to merchants instead of your real email. Promos, spam, breaches stay outside your personal inbox.']],
 narration:"Let's talk about that email inbox a little more — because it's a real superpower, not a footnote. When you sign up for GetGuac, you pick any handle you want — your name, a nickname, whatever — and you get a permanent, free at-getguac-dot-app address. Now here's the trick. To capture a receipt, just forward it to you-plus-g at getguac dot app — that plus-g tag tells our mail server to auto-file it, and GetGuac polls that folder every ten minutes looking for receipts to parse. The inbox is a real mailbox — you can open it, read messages, reply, send new email, even attach files. It is not a parsing-only trick. And the best part? Stop handing your personal email to every random store and newsletter. If someone gets breached, if a merchant goes spam-crazy, if a loyalty program won't stop emailing you — it never touches your real inbox. Your shopping life lives in GetGuac. Your personal life stays clean."},
{n:'3',accent:'lime',kick:'5–15 seconds',title:'Guac-AI reads it.',art:'parse',dur:34000,
 bullets:[['Store + date + total','Tax, payment method, last-4 of the card. Even handwritten totals on faded paper.'],
 ['Itemized line items','Every SKU, qty, price. Items become history you can search by name.'],
 ['Refund policies','Printed on the receipt? Captured. Not printed? Curated store defaults fill the gap.']],
 narration:"Step two — and this is where the magic really kicks in. Guac-AI reads your receipt. We're talking five to fifteen seconds — faster than you can finish your coffee. Behind the scenes, Google's Gemini vision model scans the image, with Groq's lightning-fast inference as backup, and OCR cleanup to catch anything the first pass missed. What does it pull out? Everything. The store name. The date. The total. The tax. Your payment method. The last four digits of your card. Every single line item — every SKU, every quantity, every price — becomes searchable history. Want to know how much you've spent on coffee beans this year? Search the item name. Refund policies printed on the receipt? Captured. Not printed? We maintain curated defaults for twenty-five major merchants like Amazon, Costco, and Home Depot, so the policy is always one tap away."},
{n:'4',accent:'amber',kick:'Capture-time + sweep',title:'Duplicates get caught.',art:'dedup',dur:30000,
 bullets:[['Same receipt, twice',"Two camera shots of the same restaurant bill won't both land in the table."],
 ['Email + camera','Forward an Amazon receipt and snap the box — Guac-AI notices the match.'],
 ['Smart matching','Normalized store names + ±1 cent tolerance — GLORY DAYS GRILL still equals Glory Days Grill.']],
 narration:"Step three. Here's a real problem that nobody else solves cleanly. You snap your dinner receipt at the restaurant. Then the restaurant emails you a copy. Then a week later your credit card statement lands. That's the same dinner — three different times — and most apps would happily clutter your books with three duplicate rows. Not GetGuac. Our duplicate detection is smart. It catches photos taken twice. It catches the email-plus-camera double-up. It catches GLORY DAYS GRILL in all caps versus Glory Days Grill in mixed case — they all collapse into one row, because we normalize the names before comparing. And it allows a one-cent wobble on the total, so AI rounding never blocks a match. Three duplicates? Become one keeper. Automatically. Every time."},
{n:'5',accent:'sky',kick:'Rules + AI',title:'Auto-categorize.',art:'categorize',dur:32000,
 bullets:[['12 built-in categories','Groceries, dining, gas, electronics, home, charity, and more — out of the box.'],
 ['Your own categories','Add custom ones — Pet, Yoga, Side Hustle — with their own emoji and color.'],
 ['Bulk auto-categorize','One button on Receipts assigns the obvious ones; you confirm or override the rest.']],
 narration:"Step four. Now your receipts are clean, parsed, and de-duplicated — but they still need to make sense. That's categorization. Out of the box, GetGuac ships with twelve thoughtful categories: groceries, dining, gas, electronics, home, clothing, health, entertainment, travel, charity, business, and other. But here's where it gets personal. You can add your own custom categories — Pet supplies, Yoga, Side hustle, Wedding fund, whatever you need — each with its own emoji and color, so your dashboard reflects how YOU actually think about money. And the categorization itself? Hit one button — Auto-categorize — and rules-plus-AI work together to assign the obvious ones in seconds. You just review and confirm the edge cases."},
{n:'6',accent:'indigo',kick:'Dashboard + Reports',title:'See where it all went.',art:'dashboard',dur:32000,
 bullets:[['Spending by Store',"Top merchants by dollar, grouped across name variants so Amazon doesn't split into five bars."],
 ['Category breakdown','1M / 3M / 1Y / all-time slices, with tax separated out for business filing.'],
 ['Repeat purchases','Items you bought again — track price drift on the things you actually use.']],
 narration:"Step five. Here's where everything comes together and you finally see your money clearly. The dashboard shows your top stores by dollar — and crucially, it groups across name variants. So Amazon, Amazon Marketplace, and Amzn Mktp don't split into five different bars — they're ONE bar, the way they should be. The Reports page slices your spending by category, over the last month, three months, a year, or your entire history. Tax gets broken out separately, which is huge for business filing or charitable deductions. And here's the favorite feature of every power user: repeat purchases. Items you've bought more than once. The same shampoo you reorder every six weeks. The price has gone up forty percent over the past year. You didn't know. Now you do."},
{n:'7',accent:'lime',kick:'Predictive shopping list',title:'Smashlist — your list writes itself.',art:'smashlist',dur:34000,
 bullets:[['Predicted from your receipts',"GetGuac learns what you rebuy and how often — and queues it up before you run out."],
 ['Grouped by store','Items sort under the store you usually buy them from, with an estimated price per item.'],
 ['Share it in one tap','Send the list to family over WhatsApp, text, or email.'],
 ['Smash as you shop','Tap an item in the aisle to smash it off the list. Cart full, list clear, nothing forgotten.']],
 narration:"Now for the feature families end up fighting over — the Smashlist. Here's the problem with every shopping-list app ever made: you still have to write the list. GetGuac doesn't ask you to. Because it has already read your receipts, it knows what you buy and how often you buy it. Milk every week. Dog food every three weeks. Laundry detergent every six. So the Smashlist quietly fills itself with the things you're about to run out of — before you run out. Open it, and everything is grouped by the store you usually buy it from, with an estimated price next to each item. Your Costco run and your grocery run basically plan themselves. Heading out? Share the list with your family in one tap. And in the aisle, when something lands in your cart, you smash it off the list. That part's more satisfying than it has any right to be."},
{n:'8',accent:'amber',kick:'Live price hunting',title:'Steals — pay less for what you rebuy.',art:'steals',dur:32000,
 bullets:[['Live shopping search','A real, current shopping search across stores — today’s prices, not last month’s.'],
 ['Starts from your receipts','Tap Find deals on any item you’ve bought — GetGuac already knows the exact brand and size.'],
 ['Dial in the specifics','Size, count, flavor — quick dropdowns make sure a 12-pack is compared against 12-packs.'],
 ['Instant when it matters','Popular searches are cached, so results often come back in a blink.']],
 narration:"And once the Smashlist tells you what you need, Steals makes sure you don't overpay for it. Steals is GetGuac's deal hunter. Pick anything you rebuy — your coffee, your protein powder, your dog's food — and Steals runs a live shopping search across the internet, lining up real prices from real stores, right now. Not last month's prices. Today's. It starts from your own receipts, so it already knows the exact brand and the exact size you buy. And you can dial in the specifics with quick dropdowns — size, count, flavor — so a twelve-pack gets compared against twelve-packs, not against a single can. Found a better price? That's a Steal. The savings go straight back into your pocket — and into your GuacMoney tally. Stop hoping you got a good price. Know it."},
{n:'9',accent:'rose',kick:'Decision feedback loop',title:'Worth it?',art:'worthIt',dur:34000,
 bullets:[['Rate every purchase','Five-star Worth-It rating per receipt — takes 2 seconds.'],
 ['GuacScore','A single number for how well you are spending that tightens as low-rated purchases drop off.'],
 ['Bank Bite','Interest, fees, penalties from your statements — the wizard nudges you when they are avoidable.']],
 narration:"Step six. The hardest question in personal finance isn't how much did I spend — it's was it worth it? GetGuac's Worth-It rating turns every purchase into a two-second decision. Tap stars from one to five. That's it. Five stars means you'd buy it again in a heartbeat. One star means you regret it. Over time, those ratings roll into your GuacScore — a single number that captures how well you're actually spending. Watch it climb as you cut the low-rated stuff. And then there's the Bank Bite watcher — the GuacWizard. It scans your statements for interest charges, late fees, penalty fees... and it tells you exactly which ones were avoidable, so you can stop bleeding money to your bank next month. This is the part nobody else does. This is the part that pays for itself."},
{n:'10',accent:'amber',kick:"Don't lose money you're owed",title:'Returns & refunds, finally tracked.',art:'returns',dur:42000,
 bullets:[['Per-item refund window',"Every receipt parses the store's refund policy: 30 days, 90 days, lifetime — even per-category rules."],
 ['Countdown timer per item','See exactly how many days you have left to return each line — color-codes red as the window closes.'],
 ['Mark items returned','Tap a checkbox. Partial returns (returned 2 of 3) and refund value tracked so totals stay accurate.'],
 ['Curated store defaults',"Amazon 30 days, Costco essentially lifetime, Apple 14 — 25+ major merchants pre-loaded."]],
 narration:"Here is something most people lose money on every year. Refund windows. You buy that thing, you mean to return it, you forget, and a month later you discover the window closed. That money is now gone forever. GetGuac fixes this. Every time we parse a receipt, we also extract the store's refund policy. Thirty days. Ninety days. Lifetime. Even category-specific rules, like Best Buy's fifteen days for electronics versus ninety for everything else. Open any receipt and you see, per line item, a countdown timer of exactly how many days you have left to return it. As the deadline approaches, the timer turns yellow, then red. Decide to send something back? Tap the checkbox. GetGuac handles partial returns and updates the receipt's effective total so your dashboard stays accurate. And there's a dedicated Returns page listing every refund you've claimed, with running totals showing how much money has come back this year. For receipts that don't print a policy at all, we ship curated defaults for over twenty-five major merchants. So even when the receipt is silent, GetGuac isn't."},
{n:'11',accent:'indigo',kick:'Honest, never preachy',title:'GuacWizard — magically protects your money.',art:'wizard',dur:42000,
 bullets:[['Bank Bite watcher','Surfaces every dollar of interest, fees, and penalties — and exactly which card charged them.'],
 ['Avoidable vs. unavoidable',"Knows the difference between an APR charge you couldn't escape and a $35 NSF you absolutely could."],
 ['Top regrets list','Receipts you rated 1 or 2 stars, sorted by dollars wasted. Read it once a quarter.'],
 ['Insights, not lectures',"'You paid $187 in interest this month.' Calm, specific, actionable. No shame."]],
 narration:"Step seven. Meet the GuacWizard — your money wizard, who magically protects your money. Calm, wise, and never preachy. The Wizard's specialty is the Bank Bite. It scans your credit-card statements and surfaces every dollar you paid in interest, fees, and penalties — broken down by which card charged what. But here's the key. The Wizard knows the difference between an APR charge you couldn't really escape, and a thirty-five dollar overdraft fee you absolutely could have. It only nudges you about the avoidable stuff. Then there's the Top Regrets list — your receipts rated one or two stars, sorted by dollars spent. Reading that list once a quarter is the single highest-leverage habit-builder we've shipped. The Wizard speaks in plain English. You paid one hundred eighty-seven dollars in interest this month. Paying the balance in full would save that every month going forward. That's it. Calm. Specific. Actionable. No shame, no buzzwords. Just honest information, delivered like a friend who happens to be really good with money."},
{n:'12',accent:'sky',kick:'Taxes, reimbursements, business runs',title:'Car Miles — track every drive.',art:'miles',dur:32000,
 bullets:[['Share-to-track','Share any Google Maps destination to GetGuac — the trip records itself.'],
 ['Auto-distance',"Reverse-geocodes your location as 'From' so you don't type anything."],
 ['Tax-ready logs','Tag trips Business, Medical, Charity, or Personal. Year-end export is audit-ready.'],
 ['No background tracking',"Location is read once, when you share. Never pinged while you're not driving."]],
 narration:"One more thing worth knowing about — Car Miles. If you ever drive for work, for clients, for medical appointments, or for charity, you can deduct those miles from your taxes — but only if you have a log. Most people don't, because writing down every trip is exhausting. GetGuac makes it a one-tap habit. When you're heading somewhere, share the destination from Google Maps directly to GetGuac. We reverse-geocode your current location as the From address, pull the destination and distance straight from the maps link, and save the trip with a single tap. Tag it Business, Medical, Charity, or Personal. At year-end, export the full mileage log — audit-ready, formatted the way the IRS wants it. And privacy-wise — we don't track you in the background. Location is read once, when you share. That's it."},
{n:'13',accent:'emerald',kick:'1,000 GM = $1 of value',title:'GuacMoney — watch your wins add up.',art:'guacmoney',dur:34000,
 bullets:[['Every receipt counts','Each receipt you capture adds 100 GuacMoney to your tally.'],
 ['Savings become GuacMoney','Every dollar that stays in your pocket counts as 1,000 GM.'],
 ['Referrals too','Invite a friend who joins and 1,000 GM lands on your tally.'],
 ['A scoreboard, not a gimmick','1,000 GM represents $1 you kept. The money was always yours — GuacMoney makes the wins visible.']],
 narration:"Let's talk about GuacMoney — the scoreboard for every win GetGuac helps you land. Here's how it adds up. Every receipt you capture? One hundred GuacMoney. Every dollar that comes back to you or stays with you — a refund you claimed before the window closed, a not-worth-it purchase you flagged and cut from your life — one thousand GuacMoney per dollar. Invite a friend who joins? One thousand more. And here's the honest part — the part we're genuinely proud of. One thousand GuacMoney represents one dollar of real value. Not a coupon. Not a gift card you have to unlock. The money was yours all along — GetGuac just helped you keep it, and GuacMoney makes that visible. So when you watch the tally climb, you're literally watching your own good decisions pay off. It turns saving money into something that feels like winning. Because it is."},
{n:'14',accent:'emerald',kick:'Row-level enforcement, end-to-end',title:'Security you can audit.',art:'security',dur:40000,
 bullets:[['Row-level security in Postgres','Every receipt, item, store, reward, email is gated by your auth.uid() in the database itself.'],
 ['Encrypted at rest, TLS in transit','Photos encrypted at rest; every request TLS 1.2+; mailbox passwords AES-GCM encrypted.'],
 ['Biometric unlock on mobile','Fingerprint or Face ID on every cold start. Credentials live in the hardware keystore.'],
 ['No third-party trackers','No Google Analytics, no Facebook pixel, no ad SDKs. We never sell your data.']],
 narration:"Security is not a checkbox at GetGuac — it's how the whole thing is built. Every single row in our database — every receipt, every item, every store, every reward, every parsed email — is gated by row-level security. That means even if someone managed to bypass our app code entirely and hit the database directly, they would only ever see rows where the auth-uid matches their token. The enforcement lives in Postgres itself. Your receipt photos? Encrypted at rest. Every request? TLS 1.2 or better. The passwords for your mail server? Encrypted with AES-GCM using a key that the application code cannot read. On mobile, your sign-in is gated by fingerprint or Face ID on every cold start. No Google Analytics, no Facebook pixel, no ad SDKs anywhere in the app. And even the diagnostic debug logs the mobile app uploads? Same rule. Only you can read your own logs. Nobody else. Ever."},
{n:'15',accent:'rose',kick:'Delete anything, any time',title:'Your data, your call.',art:'data',dur:38000,
 bullets:[['Delete individual receipts','Trash icon on any row. Cascades through items, refund policies, and the photo in storage.'],
 ['Privacy sweep','Profile → Privacy wipes categories of data — emails, receipts, items, statements, logs — in one tap.'],
 ['Full data export','Download every row we have about you as a JSON archive. Take it with you wherever.'],
 ['Delete the whole account',"One click, full purge. Gone in seconds. We don't keep backups of deleted accounts."]],
 narration:"And this one matters as much as security. Your data is yours, and you can delete it whenever you want. Want to remove one receipt? Hit the trash icon on its row. Gone — along with its line items, refund policies, and the photo in storage. Need bulk cleanup? Open Profile, tap Privacy, and wipe entire categories of data — all emails, all receipts, all items, all statements, all diagnostic logs — in a single tap. Want a copy of everything before you leave? Download a full JSON archive of every row we have about you. And if you ever decide GetGuac isn't for you anymore? Account, delete account. One click. We purge everything in seconds — and we don't keep backups of deleted accounts. No request-your-deletion-and-wait-thirty-days nonsense. It's a button. You press it. It's gone."},
{type:'closing',accent:'emerald',title:'Every receipt stays in your account.',dur:26000,
 lead:"Capture from camera, email, or statement. Guac-AI parses it in seconds. Duplicates collapse, categories assign themselves, and every dollar you keep goes on the scoreboard.",
 narration:"So here's the short version. GetGuac captures every receipt from camera, email, or statement. Guac-AI parses it in seconds. Duplicates collapse automatically. Categories assign themselves. Your dashboard reveals exactly where your money goes. Worth-It ratings turn it into smarter decisions. And your bank fees stop bleeding you. The Smashlist writes your next shopping list before you run out, Steals hunts down a better price on it, and GuacMoney keeps score of every dollar you keep. All while your data stays yours, locked behind row-level security, deletable any time. So... ready to take control? Tap Get Started, snap your first receipt, and watch your finances finally make sense. Welcome to GetGuac. Welcome to spending smarter."},
]

// AI-helper avatar chips per slide ("Under the hood"), mirroring the deck's AiPeopleStrip
const ROLES = {
  camera:['📷','Camera scout'], email:['📬','Email watcher'], statement:['🏦','Statement reader'],
  gemini:['✨','Gemini vision'], groq:['⚡','Groq fallback'], ocr:['🔠','OCR cleanup'],
  sleuth:['🔍','Dedup sleuth'], tagger:['🏷️','Auto-tagger'], analyst:['📊','Insight analyst'],
  judge:['⚖️','Worth-It judge'], refund:['↩️','Refund tracker'], wizard:['🧙','GuacWizard coach'],
  shield:['🛡️','Privacy guard'], car:['🚗','Trip logger'], predictor:['🛒','Smashlist predictor'],
  deals:['💸','Steals hunter'], tally:['💰','GuacMoney tally'],
}
const AI = {
  capture:['camera','email','statement'], inbox:['email'], parse:['gemini','groq','ocr'],
  dedup:['sleuth'], categorize:['tagger'], dashboard:['analyst'], smashlist:['predictor'],
  steals:['deals'], worthIt:['judge'], returns:['refund'], wizard:['wizard'], miles:['car'],
  guacmoney:['tally'], security:['shield'], data:['shield'],
}
function hoodHTML(art){
  const people = AI[art]; if(!people) return ''
  return `<div class="hood"><span class="lbl">Under the hood</span>${people.map(p=>{
    const r = ROLES[p]
    return `<span class="person"><span class="av">🥑<i>${r[0]}</i></span>${r[1]}</span>`
  }).join('')}</div>`
}

// ─── Deck engine ───
const stage=document.getElementById('stage'),dots=document.getElementById('dots'),
counter=document.getElementById('counter'),playBtn=document.getElementById('play'),
voicePill=document.getElementById('voicePill')
let cur=0,playing=false,voiceOn=true,timer=null,gmTimer=null

S.forEach((_,i)=>{const d=document.createElement('i');d.onclick=()=>go(i,true);dots.appendChild(d)})

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function slideHTML(s){
  const [ac,acSoft]=ACCENTS[s.accent]
  if(s.type==='hero'||s.type==='closing'){
    return `<div class="slide solo" style="--accent:${ac};--accent-soft:${acSoft}">
      <div><span class="mascot">🥑</span>
      <h1>${esc(s.title)}</h1>
      <p class="lead">${esc(s.lead)}</p>
      ${s.type==='closing'?'<a class="cta" href="/register">Get started — it’s free →</a>':''}
      </div></div>`
  }
  const bullets=s.bullets.map(b=>`<li><b>${esc(b[0])}.</b> ${esc(b[1])}</li>`).join('')
  return `<div class="slide" style="--accent:${ac};--accent-soft:${acSoft}">
    <div><div class="kicker">Step ${s.n} · ${esc(s.kick)}</div>
    <h1>${esc(s.title)}</h1><ul class="bullets">${bullets}</ul>${hoodHTML(s.art)}</div>
    <div class="viz">${VIZ[s.art]||''}</div></div>`
}

function go(i,user){
  if(i<0||i>=S.length)return
  cur=i
  window.speechSynthesis?.cancel()
  clearTimeout(timer);clearInterval(gmTimer)
  stage.innerHTML=slideHTML(S[i])
  counter.textContent=(i+1)+' / '+S.length
  ;[...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i))
  if(S[i].art==='guacmoney'){ // count-up
    const el=()=>document.getElementById('gmNum');let v=0,target=17680
    gmTimer=setInterval(()=>{v=Math.min(target,v+target/60);if(el())el().textContent=Math.round(v).toLocaleString();if(v>=target)clearInterval(gmTimer)},18)
  }
  if(voiceOn)setTimeout(()=>speak(S[i].narration),500)
  if(playing)armTimer()
}
function armTimer(){
  clearTimeout(timer)
  timer=setTimeout(()=>{ if(cur>=S.length-1){setPlaying(false);return} go(cur+1) }, voiceOn?(S[cur].dur||12000):9000)
}
function setPlaying(p){
  playing=p;playBtn.textContent=p?'⏸':'▶'
  if(p){ if(voiceOn)speak(S[cur].narration); armTimer() }
  else { clearTimeout(timer); window.speechSynthesis?.cancel() }
}

// ─── Narration (Web Speech API) — sentence-chunked for natural intonation ───
let voices=[]
function loadVoices(){
  const all=speechSynthesis.getVoices().filter(v=>/^en[-_]?/i.test(v.lang))
  voices=all.map(v=>{let s=0,n=v.name
    if(/natural|neural|online|premium|enhanced|wavenet|studio/i.test(n))s+=50
    if(/aria|jenny|samantha|karen|joanna|emma|libby|amber|sarah|nova/i.test(n))s+=20
    if(/google/i.test(n))s+=10; if(/en-US/i.test(v.lang))s+=5
    return{v,s}}).sort((a,b)=>b.s-a.s).map(x=>x.v)
}
if('speechSynthesis'in window){loadVoices();speechSynthesis.addEventListener?.('voiceschanged',loadVoices)}
function speak(text){
  if(!voiceOn||!('speechSynthesis'in window)||!text)return
  speechSynthesis.cancel()
  const voice=voices[0]
  const chunks=text.split(/(?<=[.!?…])\s+/).map(s=>s.trim()).filter(Boolean)
  ;(chunks.length?chunks:[text]).forEach(c=>{
    const u=new SpeechSynthesisUtterance(c)
    if(voice)u.voice=voice; u.rate=.95; u.pitch=1
    speechSynthesis.speak(u)
  })
}
voicePill.onclick=()=>{
  voiceOn=!voiceOn
  voicePill.classList.toggle('on',voiceOn)
  document.getElementById('voiceLabel').textContent=voiceOn?'Voice':'Muted'
  if(!voiceOn)window.speechSynthesis?.cancel()
  else speak(S[cur].narration)
}
voicePill.classList.add('on')

// ─── Controls ───
playBtn.onclick=()=>setPlaying(!playing)
document.getElementById('prev').onclick=()=>go(cur-1,true)
document.getElementById('next').onclick=()=>go(cur+1,true)
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')go(cur+1,true)
  else if(e.key==='ArrowLeft')go(cur-1,true)
  else if(e.key===' '){e.preventDefault();setPlaying(!playing)}
})
let tx=null
addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true})
addEventListener('touchend',e=>{
  if(tx==null)return
  const dx=e.changedTouches[0].clientX-tx
  if(Math.abs(dx)>48)go(cur+(dx<0?1:-1),true)
  tx=null
},{passive:true})

// boot — render first slide; voice starts on first interaction (browser policy)
stage.innerHTML=slideHTML(S[0])
counter.textContent='1 / '+S.length
dots.children[0].classList.add('on')
</script>

name: Android quality gates

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-quality.yml'
      - '.github/workflows/release-apk.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-quality.yml'
      - '.github/workflows/release-apk.yml'

permissions:
  contents: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Static analysis
        working-directory: mobile
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Unit and widget tests
        working-directory: mobile
        run: flutter test --coverage
      - name: Build release APK
        working-directory: mobile
        shell: bash
        run: |
          set +e
          flutter build apk --release 2>&1 | tee build-release.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 30 build-release.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Android release build failed::$message"
          fi
          exit "$status"

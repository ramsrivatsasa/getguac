const PAGES={
  calculators:{eyebrow:'Plan the life behind the number',title:'Turn a big goal into a next step.',lede:'Rachel and Devon did not need another intimidating forecast. They needed to know what one realistic monthly move could do for retirement, college and their emergency cushion.',image:'campaign-story/family-payoff-v2.webp',alt:'A family planning a money goal together',metric:'16 plain-English calculators',steps:[['Choose the real goal','Retirement, college, debt payoff, mortgage, healthcare or an emergency fund.'],['Use honest inputs','Start with what the household can do now—not a perfect future month.'],['Leave with one action','See the gap, the timeline and the next monthly move in dollars.']],toolTitle:'Calculators ready when the question arrives',items:['Retirement','College savings','Emergency fund','Debt payoff','Mortgage','Healthcare','Compound growth','Car affordability'],source:'/calculators'},
  bills:{eyebrow:'One calendar ahead',title:'Meet the bill before it lands.',lede:'Maya stopped discovering renewals after they posted. GetGuac projected recurring charges onto the month so there was time to keep, change or cancel them.',image:'campaign-story/subscription-renter-v2.webp',alt:'A shopper reviewing recurring bills before they land',metric:'3 bills in the next 30 days',steps:[['Recurring charge found','Receipt and statement history reveal the pattern.'],['Placed on the calendar','The expected renewal lands on the day it is likely due.'],['Decision stays yours','Keep it, budget for it or cancel it before the charge.']],toolTitle:'August at a glance',calendar:true,source:'/bills'},
  marketplace:{eyebrow:'A better checkout starts here',title:'Compare the product—not the promotion.',lede:'Lena and Mateo checked one more price before buying. Marketplace lined up current offers from real stores without requiring an account.',image:'campaign-story/shop-aisle-v2.webp',alt:'A family comparing current store prices',metric:'20+ stores · public access',steps:[['Search what you need','Start with the product, brand or category.'],['Compare current offers','See stores side by side instead of opening ten tabs.'],['Choose with context','Use the better price or save the search for later.']],toolTitle:'Popular shopping searches',items:['Groceries','Electronics','Home improvement','Pet supplies','Baby essentials','Personal care'],source:'/marketplace'},
  coupons:{eyebrow:'Check before checkout',title:'Find the code before you pay.',lede:'Robert and Elaine made one fast coupon check part of checkout. Useful store offers stayed close without turning shopping into a scavenger hunt.',image:'campaign-story/price-drop-senior-v2.webp',alt:'A couple finding a current store coupon',metric:'Current offers across major stores',steps:[['Choose the store','Open the retailer you are already planning to use.'],['Check the current offer','See promo codes and useful public deals together.'],['Pay only after checking','One extra glance can keep more money in the household.']],toolTitle:'Stores people check most',items:['Amazon','Target','Home Depot','Best Buy','Walmart','Costco'],source:'/coupons'},

  security:{eyebrow:'Security you can audit',title:'Keep household purchase data inside the household.',lede:'The Wilsons wanted receipt detail without becoming an advertising profile. GetGuac protects rows in the database, encrypts the stored files and keeps deletion in their hands.',image:'story-people/family-tablet-hero-v3.webp',alt:'A household using GetGuac private account controls',metric:'RLS locked · encrypted · deletable',steps:[['Identity gates every row','Database rules enforce that an account can only reach its own records.'],['Files stay protected','Receipt images and credentials use encryption at rest and secure transport.'],['You control the exit','Export, delete one category or remove the full account yourself.']],toolTitle:'Protection at every layer',items:['Postgres row-level security','Encrypted storage','TLS in transit','Mobile biometrics','No advertising trackers','One-click deletion'],source:'/security'},

  emergency:{eyebrow:'A cushion for real life',title:'Build the first layer of breathing room.',lede:'The Brooks family chose a milestone they could believe in. Small automatic deposits grew into protection against the next repair, medical bill or work interruption.',image:'campaign-story/playground-payoff-v2.webp',alt:'A family enjoying time together with an emergency cushion',metric:'Start with one month, then grow',steps:[['Name the likely surprise','Car, home, health and income gaps shape the first target.'],['Choose a believable transfer','A smaller amount that continues beats an ambitious plan that stops.'],['Keep it separate','The fund stays available for emergencies—not ordinary checkout.']],toolTitle:'Three useful milestones',items:['First $500','One month of essentials','Three to six months over time'],source:'https://www.consumerfinance.gov/an-essential-guide-to-building-an-emergency-fund/'},

</script>

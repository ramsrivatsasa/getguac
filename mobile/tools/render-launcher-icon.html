<!doctype html>
<html><head><meta charset="utf-8"><title>Icon render</title>
<style>
  html,body { margin: 0; padding: 0; background: transparent; }
  body { width: 1024px; height: 1024px; display: grid; place-items: center; }
  .canvas { width: 1024px; height: 1024px; display: grid; place-items: center; }
  .bg-full {
    background: linear-gradient(135deg, #15803d 0%, #65a30d 100%);
  }
  /* The mascot SVG is 220 wide × 280 tall. Scale to fit a 760px
     "safe area" inside the 1024 canvas (Android adaptive icons
     require ~66% of the canvas to be the visual). */
  .mascot { width: 760px; height: 760px; display: grid; place-items: center; }
  .mascot svg { width: 100%; height: 100%; }
</style></head>
<body>
<div class="canvas FULL_BG_CLASS">
  <div class="mascot">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 280" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="guacBody" cx="35%" cy="30%" r="80%">
          <stop offset="0%"   stop-color="#10b981"/>
          <stop offset="100%" stop-color="#064e3b"/>
        </radialGradient>
        <radialGradient id="guacFlesh" cx="50%" cy="40%" r="70%">
          <stop offset="0%"   stop-color="#d9f99d"/>
          <stop offset="100%" stop-color="#84cc16"/>
        </radialGradient>
        <radialGradient id="guacPit" cx="38%" cy="32%" r="75%">
          <stop offset="0%"   stop-color="#fcd34d"/>
          <stop offset="50%"  stop-color="#d97706"/>
          <stop offset="100%" stop-color="#78350f"/>
        </radialGradient>
      </defs>
      <g transform="translate(120 14) rotate(-22)">
        <ellipse cx="0" cy="0" rx="9" ry="20" fill="#65a30d"/>
        <path d="M 0 -16 Q 4 0 0 16" stroke="#3f6212" stroke-width="1.4" fill="none"/>
      </g>
      <rect x="106" y="22" width="3" height="14" rx="1.5" fill="#3f6212"/>
      <path d="M 110 32 C 92 34, 82 48, 80 72 C 80 92, 70 108, 60 130 C 46 162, 44 200, 70 226 C 88 244, 132 244, 150 226 C 176 200, 174 162, 160 130 C 150 108, 140 92, 140 72 C 138 48, 128 34, 110 32 Z" fill="url(#guacBody)"/>
      <path d="M 86 60 C 78 80, 70 110, 64 140" stroke="white" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.18"/>
      <path d="M 110 50 C 96 52, 89 62, 88 80 C 88 96, 80 110, 72 130 C 60 158, 60 192, 82 214 C 96 226, 124 226, 138 214 C 160 192, 160 158, 148 130 C 140 110, 132 96, 132 80 C 131 62, 124 52, 110 50 Z" fill="url(#guacFlesh)"/>
      <ellipse cx="110" cy="172" rx="38" ry="40" fill="url(#guacPit)"/>
      <ellipse cx="96" cy="158" rx="11" ry="6" fill="#fef3c7" opacity="0.55"/>
      <circle cx="80"  cy="190" r="6" fill="#fb7185" opacity="0.55"/>
      <circle cx="140" cy="190" r="6" fill="#fb7185" opacity="0.55"/>
      <circle cx="94" cy="168" r="8" fill="white" stroke="#1f2937" stroke-width="1"/>
      <circle cx="126" cy="168" r="8" fill="white" stroke="#1f2937" stroke-width="1"/>
      <circle cx="95" cy="169" r="4" fill="#1f2937"/>
      <circle cx="127" cy="169" r="4" fill="#1f2937"/>
      <circle cx="93" cy="166.5" r="1.6" fill="white"/>
      <circle cx="125" cy="166.5" r="1.6" fill="white"/>
      <path d="M 100 194 Q 110 204, 120 194" stroke="#1f2937" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    </svg>
  </div>
</div>
</body></html>

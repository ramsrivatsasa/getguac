name: Release APK

# Builds the mobile APK and publishes it as a GitHub Release whenever a
# `v*` tag is pushed. The mobile UpdateService polls this releases/latest
# endpoint to discover new versions; without this workflow the endpoint
# returns stale data and in-app update alerts never fire.
#
# Signing: this build uses the Flutter Android template's default debug
# keystore (configured in app/build.gradle.kts). That's deliberately
# matched to what local-built APKs use today so users don't get hit with
# a signature-mismatch reinstall on the first CI-built update.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.2.76). Must already exist.'
        required: true
      manual_device_tests_passed:
        description: 'Auth, password reset, receipt capture, and WebView checks passed on a physical Android device'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require physical-device test attestation
        env:
          DEVICE_TESTS_PASSED: ${{ inputs.manual_device_tests_passed }}
        run: test "$DEVICE_TESTS_PASSED" = "true"

  build:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve and verify tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git rev-parse "refs/tags/$RELEASE_TAG"
          echo "ref=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Install pub deps
        working-directory: mobile
        run: flutter pub get

      - name: Configure release signing
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_STORE_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/getguac-release.jks
          {
            echo "storeFile=getguac-release.jks"
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > key.properties

      - name: Static analysis
        working-directory: mobile
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Unit and widget tests
        working-directory: mobile
        run: flutter test --coverage

      - name: Build universal release APK for emulator gate
        working-directory: mobile
        run: flutter build apk --release

      - name: Launch release APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r mobile/build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell monkey -p app.getguac.getguac -c android.intent.category.LAUNCHER 1
            sleep 15
            adb shell uiautomator dump /sdcard/getguac-window.xml
            adb pull /sdcard/getguac-window.xml mobile/build/getguac-window.xml
            grep -Eq "GetGuac|Sign in|Welcome" mobile/build/getguac-window.xml
            ! adb logcat -d '*:E' | grep -E "FATAL EXCEPTION|Process: app.getguac.getguac"

      - name: Build split-per-ABI release APKs
        working-directory: mobile
        run: flutter build apk --release --split-per-abi

      - name: Stage APKs
        run: |
          mkdir -p dist
          cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk     dist/
          cp mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk   dist/
          cp mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk        dist/
          ls -la dist

      - name: Build release notes
        id: notes
        run: |
          {
            echo "body<<__EOF__"
            echo "Mobile release ${{ steps.tag.outputs.ref }}"
            echo ""
            echo "**Install:** download \`app-arm64-v8a-release.apk\` (for most phones) and tap to install. This artifact passed analysis, tests, an emulator launch, and the required physical-device checklist."
            echo ""
            echo "---"
            echo ""
            echo "Recent commits:"
            git log -10 --pretty=tformat:'- %s' --no-decorate
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.ref }}
          name: ${{ steps.tag.outputs.ref }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            dist/app-arm64-v8a-release.apk
            dist/app-armeabi-v7a-release.apk
            dist/app-x86_64-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

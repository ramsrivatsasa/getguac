  calculators:{eyebrow:'Plan the life behind the number',title:'Turn a big goal into a next step.',lede:'Rachel and Devon did not need another intimidating forecast. They needed to know what one realistic monthly move could do for retirement, college and their emergency cushion.',image:'campaign-story/family-payoff-v2.webp',alt:'A family planning a money goal together',metric:'14 plain-English calculators',steps:[['Choose the real goal','Retirement, college, debt payoff, mortgage, healthcare or an emergency fund.'],['Use honest inputs','Start with what the household can do now—not a perfect future month.'],['Leave with one action','See the gap, the timeline and the next monthly move in dollars.']],toolTitle:'Calculators ready when the question arrives',items:['Retirement','College savings','Emergency fund','Debt payoff','Mortgage','Healthcare','Compound growth','Car affordability'],source:'https://getguac.app/plan'},
  bills:{eyebrow:'One calendar ahead',title:'Meet the bill before it lands.',lede:'Maya stopped discovering renewals after they posted. GetGuac projected recurring charges onto the month so there was time to keep, change or cancel them.',image:'campaign-story/subscription-renter-v2.webp',alt:'A shopper reviewing recurring bills before they land',metric:'3 bills in the next 30 days',steps:[['Recurring charge found','Receipt and statement history reveal the pattern.'],['Placed on the calendar','The expected renewal lands on the day it is likely due.'],['Decision stays yours','Keep it, budget for it or cancel it before the charge.']],toolTitle:'August at a glance',calendar:true,source:'https://getguac.app/bills'},
  marketplace:{eyebrow:'A better checkout starts here',title:'Compare the product—not the promotion.',lede:'Lena and Mateo checked one more price before buying. Marketplace lined up current offers from real stores without requiring an account.',image:'campaign-story/shop-aisle-v2.webp',alt:'A family comparing current store prices',metric:'20+ stores · public access',steps:[['Search what you need','Start with the product, brand or category.'],['Compare current offers','See stores side by side instead of opening ten tabs.'],['Choose with context','Use the better price or save the search for later.']],toolTitle:'Popular shopping searches',items:['Groceries','Electronics','Home improvement','Pet supplies','Baby essentials','Personal care'],source:'https://getguac.app/marketplace'},

  refunds:{eyebrow:'Money still yours',title:'Act before the return window becomes a wall.',lede:'Nina kept the receipt, the item deadline and the refund value together. She returned it on time and followed the money until it reached the account.',image:'campaign-story/protect-return-v2.webp',alt:'A shopper acting before a return deadline expires',metric:'Receipt + deadline + refund proof',steps:[['Keep the proof','Store, item, date, payment method and policy belong together.'],['Act before the deadline','A visible countdown keeps the choice available.'],['Follow the refund','Returned does not mean complete until the money lands.']],toolTitle:'A clean return checklist',items:['Receipt saved','Policy checked','Item condition documented','Return submitted','Refund verified'],source:'https://consumer.ftc.gov/articles/disputing-credit-card-charges'},

})();

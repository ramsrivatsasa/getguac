<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">Tell a stock split from share dilution — visual explanation</title><desc id="desc">In the lesson’s made-up company, a 2-for-1 split keeps your ownership at 1%. Issuing 250,000 additional shares instead reduces it to 0.8%. Price alone does not tell you ownership.</desc><rect width="800" height="560" rx="24" fill="#F8FAFC"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#6D28D9">GETGUAC ACADEMY</text><text x="30" y="78" font-family="Arial,sans-serif" font-size="20" fill="#475569">Stocks and the market · Illustrative example</text><text x="30" y="132" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">Different events. Different ownership.</text><rect x="30" y="170" width="740" height="100" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/><text x="52" y="209" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">Before</text><text x="52" y="243" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">10,000 of 1,000,000</text><text x="646" y="232" font-family="Arial,sans-serif" font-size="40" font-weight="600" fill="#6D28D9">1.0%</text><rect x="30" y="290" width="740" height="100" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/><text x="52" y="329" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">2-for-1 split</text><text x="52" y="363" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">20,000 of 2,000,000</text><text x="646" y="352" font-family="Arial,sans-serif" font-size="40" font-weight="600" fill="#0369A1">1.0%</text><rect x="30" y="410" width="740" height="100" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/><text x="52" y="449" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">New shares issued</text><text x="52" y="483" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">10,000 of 1,250,000</text><text x="646" y="472" font-family="Arial,sans-serif" font-size="40" font-weight="600" fill="#C2410C">0.8%</text></svg>
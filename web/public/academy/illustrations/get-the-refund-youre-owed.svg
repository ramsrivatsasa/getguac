<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">Claim a refund and follow it until it arrives — visual explanation</title><desc id="desc">Keep proof of purchase, request the refund, and check that the money reaches your account. A request or approval is not the same as money received.</desc><rect width="800" height="560" rx="24" fill="#F8FAFC"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#6D28D9">GETGUAC ACADEMY</text><text x="30" y="78" font-family="Arial,sans-serif" font-size="20" fill="#475569">Refunds and receipts · Illustrative example</text><g transform="translate(42 170)" color="#172D3B"><circle cx="96" cy="92" r="80" fill="#EFF6FF"/><g transform="translate(48 44)"><g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M27 14h31l13 14v54H27z"/><path d="M58 14v16h13M37 42h23M37 53h23M37 64h15"/></g></g></g><text x="40" y="390" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#0369A1">Keep your proof</text><g transform="translate(302 170)" color="#172D3B"><circle cx="96" cy="92" r="80" fill="#EFF6FF"/><g transform="translate(48 44)"><g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M48 12L78 24v22c0 21-15 31-30 40C33 77 18 67 18 46V24z"/><path d="M32 47l11 11 23-24"/></g></g></g><text x="300" y="390" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#0369A1">Request a refund</text><g transform="translate(562 170)" color="#172D3B"><circle cx="96" cy="92" r="80" fill="#EFF6FF"/><g transform="translate(48 44)"><g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M48 14v65M25 82h46M17 29h62M25 29L11 59h28zM71 29L57 59h28z"/></g></g></g><text x="560" y="390" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#0369A1">Confirm receipt</text><path d="M205 262h85m-16-12 16 12-16 12" fill="none" stroke="#4F7DE0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M465 262h85m-16-12 16 12-16 12" fill="none" stroke="#4F7DE0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="485" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#172D3B">Track the refund until the money reaches your account.</text></svg>
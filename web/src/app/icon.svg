  </defs>
  <!-- sprout -->
  <path d="M512 312 C512 270 512 250 512 232" stroke="#3f6212" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M512 252 C470 250 432 224 430 188 C474 188 506 214 512 252 Z" fill="#4d7c0f"/>
  <path d="M512 244 C552 238 590 208 596 172 C552 176 520 206 512 244 Z" fill="#65a30d"/>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">How to budget with the 50/30/20 rule — visual explanation</title><desc id="desc">Illustrative $4,200 take-home month: $2,100 for needs, $1,260 for wants, and $840 for savings and extra debt. The 50/30/20 split is a guideline, not a requirement.</desc><rect width="800" height="560" rx="24" fill="#F8FAFC"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#6D28D9">GETGUAC ACADEMY</text><text x="30" y="78" font-family="Arial,sans-serif" font-size="20" fill="#475569">Budgeting and cash flow · Illustrative example</text><text x="30" y="140" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">$4,200 take-home pay</text><rect x="30" y="175" width="370" height="70" fill="#6D28D9"/><circle cx="48" cy="302" r="12" fill="#6D28D9"/><text x="78" y="312" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">Needs: 50%</text><text x="632" y="312" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">$2,100</text><rect x="400" y="175" width="222" height="70" fill="#0369A1"/><circle cx="48" cy="382" r="12" fill="#0369A1"/><text x="78" y="392" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">Wants: 30%</text><text x="632" y="392" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">$1,260</text><rect x="622" y="175" width="148" height="70" fill="#C2410C"/><circle cx="48" cy="462" r="12" fill="#C2410C"/><text x="78" y="472" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">Savings + extra debt: 20%</text><text x="632" y="472" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#172D3B">$840</text></svg>
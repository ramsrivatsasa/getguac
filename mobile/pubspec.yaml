name: getguac
description: GetGuac — Smart receipt & rewards management
publish_to: 'none'
version: 0.3.7+99

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase (replaces Firebase)
  supabase_flutter: ^2.5.6

  # Camera & Image
  camera: ^0.10.5+9
  image_picker: ^1.1.2

  # Biometric auth (fingerprint / face unlock)
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # Update check + HTTP client
  http: ^1.2.2
  package_info_plus: ^8.0.2
  # file_picker removed for v1 — not used yet, ships compileSdk=34 which breaks builds.
  # Add back when we need PDF/document picking on mobile (use the latest version).

  # Navigation & State
  go_router: ^13.2.4
  provider: ^6.1.2

  # UI
  cupertino_icons: ^1.0.6
  fl_chart: ^0.67.0
  flutter_svg: ^2.0.10+1
  # WebView for HTML email rendering. Official Flutter team package — battle-tested,
  # unlike flutter_html 3.0 beta which crashed the app on init (see v0.2.4 → 0.2.5).
  webview_flutter: ^4.10.0
  # Receive shared URLs/text from other apps (Google Maps → "Share to GetGuac")
  # so users can log a trip from a Maps destination with one tap.
  receive_sharing_intent: ^1.8.0
  # Outbound share — invokes the OS share sheet so users can hand off a
  # GetGuac /share/<token> URL to WhatsApp / SMS / email / etc. Used by
  # the Buy Again per-item Share button on the Smashlist.
  share_plus: ^10.0.0

  # Push notifications via Firebase Cloud Messaging (FCM). firebase_core
  # initializes the SDK; firebase_messaging handles FCM token + inbound
  # message routing; flutter_local_notifications surfaces the
  # notification in the system tray when a message arrives while the app
  # is in the foreground (FCM by itself won't display a banner in that
  # state). Together they cover all three states (foreground/background/
  # terminated). Setup is gated behind `--dart-define=FIREBASE_ENABLED=
  # true` so a debug build without a configured Firebase project still
  # starts cleanly.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  path_provider: ^2.1.3
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  geolocator: ^12.0.0
  # In-app APK download + install. Lets us drop the new build into the
  # app's cache dir (auto-cleaned by Android) instead of leaving it in
  # the user's Downloads folder forever.
  open_filex: ^4.5.0
  # ML Kit Document Scanner + wakelock_plus removed in v0.2.69. The
  # dashboard FAB and the multi-page scanner flow that used them were
  # removed — capture is now a single-photo camera button on the
  # Receipts screen only (image_picker, no scanner module download).

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# App icon configuration — run: flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#15803d"
  adaptive_icon_foreground: "assets/icon/icon-fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/mascot/
    - assets/icon/

name: Android quality gates

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-quality.yml'
      - '.github/workflows/release-apk.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-quality.yml'
      - '.github/workflows/release-apk.yml'

permissions:
  contents: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Static analysis
        working-directory: mobile
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Unit and widget tests
        working-directory: mobile
        run: flutter test --coverage
      - name: Build release APK
        working-directory: mobile
        shell: bash
        run: |
          set +e
          flutter build apk --release 2>&1 | tee build-release.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 30 build-release.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Android release build failed::$message"
          fi
          exit "$status"
      - name: Launch release APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r mobile/build/app/outputs/flutter-apk/app-release.apk || { echo "::error title=Android emulator install failed::adb could not install the release APK"; exit 1; }
            adb logcat -c
            adb shell monkey -p app.getguac.getguac -c android.intent.category.LAUNCHER 1 || { echo "::error title=Android emulator launch failed::adb monkey could not launch GetGuac"; exit 1; }
            sleep 15
            adb shell uiautomator dump /sdcard/getguac-window.xml || { echo "::error title=Android UI inspection failed::uiautomator could not dump the app window"; exit 1; }
            adb pull /sdcard/getguac-window.xml mobile/build/getguac-window.xml || { echo "::error title=Android UI inspection failed::could not retrieve the UI dump"; exit 1; }
            grep -Eq "GetGuac|Sign in|Welcome" mobile/build/getguac-window.xml || { echo "::error title=Android launch UI missing::GetGuac did not show its login or welcome UI"; exit 1; }
            if adb logcat -d '*:E' | grep -E "FATAL EXCEPTION|Process: app.getguac.getguac"; then
              echo "::error title=Android fatal exception::GetGuac produced a fatal exception after cold launch"
              exit 1
            fi

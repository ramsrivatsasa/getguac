<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 280">
  <!--
    happy_v2.svg — separable-parts mascot for animation.
    Top-level groups have stable ids so the Flutter side can target
    individual subtrees (eyes, mouth, arms) independently of the
    overall body silhouette. Order matters for stacking:
      arms (behind body) -> body -> pit -> mouth -> eyes (front).
  -->
  <defs>
    <radialGradient id="v2GuacBody" cx="35%" cy="30%" r="80%">
      <stop offset="0%"   stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>
    <radialGradient id="v2GuacFlesh" cx="50%" cy="40%" r="70%">
      <stop offset="0%"   stop-color="#d9f99d"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </radialGradient>
    <radialGradient id="v2GuacPit" cx="38%" cy="32%" r="75%">
      <stop offset="0%"   stop-color="#fcd34d"/>
      <stop offset="50%"  stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>

    <!-- Clip the lid rectangle to the eye's circular shape so a
         growing lid still looks like an eyelid, not a square. -->
    <clipPath id="v2EyeClipL">
      <circle cx="94" cy="168" r="8"/>
    </clipPath>
    <clipPath id="v2EyeClipR">
      <circle cx="126" cy="168" r="8"/>
    </clipPath>
  </defs>

  <!-- ARMS: drawn first so they sit behind the body. Each arm is its
       own subgroup with a transform-origin at the shoulder so a
       parent rotate() swings it naturally. -->
  <g id="arms">
    <g id="arm-left" style="transform-origin: 78px 150px;">
      <ellipse cx="66" cy="158" rx="12" ry="7"
               fill="#16a34a" stroke="#064e3b" stroke-width="1"
               transform="rotate(-18 78 150)"/>
    </g>
    <g id="arm-right" style="transform-origin: 142px 150px;">
      <ellipse cx="154" cy="158" rx="12" ry="7"
               fill="#16a34a" stroke="#064e3b" stroke-width="1"
               transform="rotate(18 142 150)"/>
    </g>
  </g>

  <!-- Stem + leaf (decorative, not animated). -->
  <g id="stem">
    <g transform="translate(120 14) rotate(-22)">
      <ellipse cx="0" cy="0" rx="9" ry="20" fill="#65a30d"/>
      <path d="M 0 -16 Q 4 0 0 16" stroke="#3f6212" stroke-width="1.4" fill="none"/>
    </g>
    <rect x="106" y="22" width="3" height="14" rx="1.5" fill="#3f6212"/>
  </g>

  <!-- BODY: avocado outline + inner flesh + sheen. -->
  <g id="body">
    <path d="M 110 32 C 92 34, 82 48, 80 72 C 80 92, 70 108, 60 130 C 46 162, 44 200, 70 226 C 88 244, 132 244, 150 226 C 176 200, 174 162, 160 130 C 150 108, 140 92, 140 72 C 138 48, 128 34, 110 32 Z"
          fill="url(#v2GuacBody)"/>
    <path d="M 86 60 C 78 80, 70 110, 64 140"
          stroke="white" stroke-width="6" stroke-linecap="round"
          fill="none" opacity="0.18"/>
    <path d="M 110 50 C 96 52, 89 62, 88 80 C 88 96, 80 110, 72 130 C 60 158, 60 192, 82 214 C 96 226, 124 226, 138 214 C 160 192, 160 158, 148 130 C 140 110, 132 96, 132 80 C 131 62, 124 52, 110 50 Z"
          fill="url(#v2GuacFlesh)"/>
  </g>

  <!-- PIT: brown center. Pulled out as its own group so a pulse
       animation can scale it without scaling the eyes/mouth above. -->
  <g id="pit" style="transform-origin: 110px 172px;">
    <ellipse cx="110" cy="172" rx="38" ry="40" fill="url(#v2GuacPit)"/>
    <ellipse cx="96"  cy="158" rx="11" ry="6"  fill="#fef3c7" opacity="0.55"/>
  </g>

  <!-- CHEEKS: cosmetic, kept outside #eyes so blink doesn't hide them. -->
  <g id="cheeks">
    <circle cx="80"  cy="190" r="6" fill="#fb7185" opacity="0.55"/>
    <circle cx="140" cy="190" r="6" fill="#fb7185" opacity="0.55"/>
  </g>

  <!-- MOUTH: smile by default. A separate path lets the Flutter side
       swap or tween d-attribute for talk/open/frown states. -->
  <g id="mouth">
    <path id="mouth-path"
          d="M 100 194 Q 110 204, 120 194"
          stroke="#1f2937" stroke-width="3.5" stroke-linecap="round"
          fill="none"/>
  </g>

  <!-- EYES: two eye subgroups. Each contains the white sclera, dark
       pupil, highlight, AND a lid <rect> that starts at height=0
       (fully open). Tween the lid's height up to 16 to close the eye
       for a blink. The clipPath keeps the lid round. -->
  <g id="eyes">
    <g id="eye-left" clip-path="url(#v2EyeClipL)">
      <circle cx="94" cy="168" r="8" fill="white" stroke="#1f2937" stroke-width="1"/>
      <circle cx="95" cy="169" r="4" fill="#1f2937"/>
      <circle cx="93" cy="166.5" r="1.6" fill="white"/>
      <rect id="lid-left"
            x="86" y="160" width="16" height="0"
            fill="#064e3b"/>
    </g>
    <g id="eye-right" clip-path="url(#v2EyeClipR)">
      <circle cx="126" cy="168" r="8" fill="white" stroke="#1f2937" stroke-width="1"/>
      <circle cx="127" cy="169" r="4" fill="#1f2937"/>
      <circle cx="125" cy="166.5" r="1.6" fill="white"/>
      <rect id="lid-right"
            x="118" y="160" width="16" height="0"
            fill="#064e3b"/>
    </g>
  </g>
</svg>
